# XcodeGen の設定。`xcodegen generate` で Yamamuki.xcodeproj を作る(生成物は git 管理外)。
name: Yamamuki
options:
  bundleIdPrefix: io.github.shohei0205
  # 画面の文言(Yamamuki/Localizable.xcstrings)は日本語で書くので、開発の言語を日本語にする。
  developmentLanguage: ja
  deploymentTarget:
    iOS: "15.0"
packages:
  YamamukiCore:
    path: YamamukiCore
  # 広告(Google AdMob)。13.4 以降は Xcode 26.2 以上が要る。13 系の中で新しい版を使う。
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 13.13.0
  # 利用状況の計測(Google アナリティクス for Firebase)。初回起動を Google 広告のコンバージョンに使う(docs/analytics.md)。
  # IDFA を使わない FirebaseAnalyticsCore を使う。13 系は Xcode 26.2 以上が要る。
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 13.2.0
  # 広告のオンデバイス計測。FirebaseAnalyticsCore には入っていないので別に足す。
  # Firebase(GoogleAppMeasurement)が対応する版を決めるので、ここでは 3 系の中で広く許す。
  GoogleAdsOnDeviceConversion:
    url: https://github.com/googleads/google-ads-on-device-conversion-ios-sdk
    majorVersion: 3.8.0
targets:
  Yamamuki:
    type: application
    platform: iOS
    sources: [Yamamuki]
    dependencies:
      - package: YamamukiCore
      - package: GoogleMobileAds
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: GoogleAdsOnDeviceConversion
    # 広告の ID(既定は Google のテスト用。本番の ID は手元の Ads.local.xcconfig に書く)。
    configFiles:
      Debug: Ads.xcconfig
      Release: Ads.xcconfig
    settings:
      base:
        PRODUCT_NAME: Yamamuki
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shohei0205.yamamuki
        MARKETING_VERSION: 0.11.0
        CURRENT_PROJECT_VERSION: 11
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # 自動で作る Info.plist に、広告の ID など INFOPLIST_KEY_ で書けない項目を足す。
        INFOPLIST_FILE: Yamamuki/Info.plist
        # Firebase の Analytics は、コードから直接呼ばないので、-ObjC が無いとリンクされず計測が始まらない。
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 山むき
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 現在地から見える山の方位と距離を計算するために使います。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # 暗号は iOS 標準のもの(URLSession の HTTPS、CryptoKit の SHA-256)しか使わないので、輸出規制の対象外と宣言する。
        # これで TestFlight へのアップロードのたびに輸出コンプライアンスを聞かれなくなる。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      # 山データは、Release はカタログ(catalog.json)の stable、Debug はカタログの dev(無ければ配布版と同じ stable)を読む
      # (DialModel.peakDataChannel)。
      # 広告(AdMob のバナー)は Release だけで出す(AdBanner.swift)。開発中に試すときは xcodebuild ... ADS_ENABLED=YES のように変える。
      # 利用状況の計測(Firebase)も Release だけで行う(UsageAnalytics.swift)。開発中の起動を数えないため。
      configs:
        Release:
          ADS_ENABLED: "YES"
          ANALYTICS_ENABLED: "YES"
        Debug:
          ADS_ENABLED: "NO"
          ANALYTICS_ENABLED: "NO"
  # 画面を実際に操作する UI テスト(XCUITest)。実機でもシミュレータでも動く。
  YamamukiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [YamamukiUITests]
    dependencies:
      - target: Yamamuki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shohei0205.yamamuki.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
# テストのあとの処理を足すため、スキームはここでまとめて定義する。
schemes:
  Yamamuki:
    build:
      targets:
        Yamamuki: all
        YamamukiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets: [YamamukiUITests]
      # UI テストが終わると Xcode が山むきを終了させ、実機ではテスト用アプリの黒い画面が残る。
      # すぐ続けて触れるよう、テストした端末で山むきを起動し直す。起動できなくてもテストの結果は変えない。
      postActions:
        - name: 山むきを起動し直す
          settingsTarget: Yamamuki
          script: |
            if [ "$PLATFORM_NAME" = iphoneos ]; then
              xcrun devicectl device process launch --device "$TARGET_DEVICE_IDENTIFIER" "$PRODUCT_BUNDLE_IDENTIFIER"
            else
              xcrun simctl launch "$TARGET_DEVICE_IDENTIFIER" "$PRODUCT_BUNDLE_IDENTIFIER"
            fi > /dev/null 2>&1 || true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
