# XcodeGen の設定。`xcodegen generate` で Yamamuki.xcodeproj を作る(生成物は git 管理外)。
name: Yamamuki
options:
  bundleIdPrefix: io.github.shohei0205
  # 画面の文言(Yamamuki/Localizable.xcstrings)は日本語で書くので、開発の言語を日本語にする。
  developmentLanguage: ja
  deploymentTarget:
    iOS: "15.0"
packages:
  YamamukiCore:
    path: YamamukiCore
  # 広告(Google AdMob)。13.4 以降は Xcode 26.2 が要り、CI(Xcode 16.4)でビルドできないので 13.3 系にとどめる。
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    minorVersion: 13.3.0
targets:
  Yamamuki:
    type: application
    platform: iOS
    sources: [Yamamuki]
    dependencies:
      - package: YamamukiCore
      - package: GoogleMobileAds
    # 広告の ID(既定は Google のテスト用。本番の ID は手元の Ads.local.xcconfig に書く)。
    configFiles:
      Debug: Ads.xcconfig
      Release: Ads.xcconfig
    settings:
      base:
        PRODUCT_NAME: Yamamuki
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shohei0205.yamamuki
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 8
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # 自動で作る Info.plist に、広告の ID など INFOPLIST_KEY_ で書けない項目を足す。
        INFOPLIST_FILE: Yamamuki/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 山むき
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 現在地から見える山の方位と距離を計算するために使います。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # 暗号は iOS 標準のもの(URLSession の HTTPS、CryptoKit の SHA-256)しか使わないので、輸出規制の対象外と宣言する。
        # これで TestFlight へのアップロードのたびに輸出コンプライアンスを聞かれなくなる。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      # 山データは、Release はカタログ(catalog.json)の osm-peaks の stable、Debug は PEAK_DATA_SOURCE で選んだほうを読む
      # (DialModel.peakDataChannel)。既定(current)はカタログの osm-peaks の dev(無ければ配布版と同じ stable)。
      # yamamuki-data の dev が公開する最新の開発版(points/osm-peaks-dev/)を直接試すときは、ビルド設定 PEAK_DATA_SOURCE を dev にする
      # (例: xcodebuild ... PEAK_DATA_SOURCE=dev。Xcode ではターゲットの Build Settings の User-Defined で変える)。
      # 広告(AdMob のバナー)は Release だけで出す(AdBanner.swift)。開発中に試すときは xcodebuild ... ADS_ENABLED=YES のように変える。
      configs:
        Release:
          ADS_ENABLED: "YES"
        Debug:
          ADS_ENABLED: "NO"
          PEAK_DATA_SOURCE: current
          PEAK_DATA_CONDITION_current: ""
          PEAK_DATA_CONDITION_dev: PEAK_DATA_DEV
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(PEAK_DATA_CONDITION_$(PEAK_DATA_SOURCE))"
  # 画面を実際に操作する UI テスト(XCUITest)。実機でもシミュレータでも動く。
  YamamukiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [YamamukiUITests]
    dependencies:
      - target: Yamamuki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shohei0205.yamamuki.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
# テストのあとの処理を足すため、スキームはここでまとめて定義する。
schemes:
  Yamamuki:
    build:
      targets:
        Yamamuki: all
        YamamukiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets: [YamamukiUITests]
      # UI テストが終わると Xcode が山むきを終了させ、実機ではテスト用アプリの黒い画面が残る。
      # すぐ続けて触れるよう、テストした端末で山むきを起動し直す。起動できなくてもテストの結果は変えない。
      postActions:
        - name: 山むきを起動し直す
          settingsTarget: Yamamuki
          script: |
            if [ "$PLATFORM_NAME" = iphoneos ]; then
              xcrun devicectl device process launch --device "$TARGET_DEVICE_IDENTIFIER" "$PRODUCT_BUNDLE_IDENTIFIER"
            else
              xcrun simctl launch "$TARGET_DEVICE_IDENTIFIER" "$PRODUCT_BUNDLE_IDENTIFIER"
            fi > /dev/null 2>&1 || true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
