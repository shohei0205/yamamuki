# XcodeGen の設定。`xcodegen generate` で Yamamuki.xcodeproj を作る(生成物は git 管理外)。
name: Yamamuki
options:
  bundleIdPrefix: io.github.shohei0205
  deploymentTarget:
    iOS: "15.0"
packages:
  YamamukiCore:
    path: YamamukiCore
targets:
  Yamamuki:
    type: application
    platform: iOS
    sources: [Yamamuki]
    dependencies:
      - package: YamamukiCore
    settings:
      base:
        PRODUCT_NAME: Yamamuki
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shohei0205.yamamuki
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 山むき
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 現在地から見える山の方位と距離を計算するために使います。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
      # 山データの manifest は、Debug は開発版(peaks-dev/)、Release は正式版(peaks/)を読む(DialModel.peakDataDev)。
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PEAK_DATA_DEV"
  # 画面を実際に操作する UI テスト(XCUITest)。実機でもシミュレータでも動く。
  YamamukiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [YamamukiUITests]
    dependencies:
      - target: Yamamuki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shohei0205.yamamuki.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
# テストのあとの処理を足すため、スキームはここでまとめて定義する。
schemes:
  Yamamuki:
    build:
      targets:
        Yamamuki: all
        YamamukiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets: [YamamukiUITests]
      # UI テストが終わると Xcode が山むきを終了させ、実機ではテスト用アプリの黒い画面が残る。
      # すぐ続けて触れるよう、テストした端末で山むきを起動し直す。起動できなくてもテストの結果は変えない。
      postActions:
        - name: 山むきを起動し直す
          settingsTarget: Yamamuki
          script: |
            if [ "$PLATFORM_NAME" = iphoneos ]; then
              xcrun devicectl device process launch --device "$TARGET_DEVICE_IDENTIFIER" "$PRODUCT_BUNDLE_IDENTIFIER"
            else
              xcrun simctl launch "$TARGET_DEVICE_IDENTIFIER" "$PRODUCT_BUNDLE_IDENTIFIER"
            fi > /dev/null 2>&1 || true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
