name: Build

on:
  push:
    branches: [main]
  pull_request:

# 外部からの PR でも動くので、トークンはリポジトリの読み取りだけに絞る。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: core のテスト
        working-directory: android
        run: ./gradlew -p core test
      - name: アプリのビルド
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: アプリの単体テスト(DB の移行など)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      # ビルドで書き出した DB のスキーマを、PR では向き先のブランチとも比べる。
      - name: DB のスキーマの確認
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            .github/scripts/check-room-schemas.sh FETCH_HEAD
          else
            .github/scripts/check-room-schemas.sh
          fi
