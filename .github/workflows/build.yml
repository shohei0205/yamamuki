name: Build

on:
  push:
    branches: [main]
  pull_request:

# 外部からの PR でも動くので、トークンはリポジトリの読み取りだけに絞る。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: core のテスト
        run: ./gradlew -p core test
      - name: アプリのビルド
        run: ./gradlew :app:assembleDebug
