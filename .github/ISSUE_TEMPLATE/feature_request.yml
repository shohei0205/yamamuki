name: 機能の要望
description: 新しい機能や改善を提案する
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること・やりたいこと
      description: どんな場面で何ができると嬉しいか
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する内容
      description: どう動いてほしいか
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 対象のプラットフォーム
      options:
        - 両方
        - Android
        - iOS
  - type: textarea
    id: alternatives
    attributes:
      label: 考えた代わりの方法
  - type: textarea
    id: context
    attributes:
      label: 補足
      description: 参考になるアプリや画像など
