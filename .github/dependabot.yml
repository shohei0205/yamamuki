# 依存ライブラリの更新 PR を週 1 回自動で作る。
# PR の数が増えすぎないよう、マイナー/パッチ更新はまとめて 1 つの PR にする。
# iOS (ios/) は外部パッケージを使っていないので対象外。使い始めたら swift を追加する。
version: 2
updates:
  # Android (app/ と core/)。バージョンは gradle/libs.versions.toml で共通管理している。
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  # CI (.github/workflows/) で使っている Actions。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ["*"]
